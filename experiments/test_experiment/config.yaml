simulation:
  repo_name: "10000p_default_ranges"
  n_samples: 2000
  n_timepoints: 10000
  seed: 42

data:
  n_timepoints: 500
  feature_type: timeseries
  transforms:
    - TimeSlice:
        t_min: 0
        t_max: 10
    - Resample:
        n_timepoints: 500
        distribution: "even"
    - GaussianNoise:
        std: 0.1
  features:
    - t
    - x
    - y
    - z
  targets:
    - v0
    - theta
    - phi



model:
  name: "MLP"
  params:
    input_dim: 2000
    output_dim: 3
    hidden_dim: [8000, 2000]
    num_hidden_layers: 2

loss:
  name: "MSE"
  params: {}

optimizer:
  name: "Adam"
  params:
    lr: 1.0e-3

scheduler:
  name: "ReduceLROnPlateau"
  params:
    mode: "min"
    factor: 0.1
    patience: 10
    min_lr: 1.0e-6

training:
  seed: 42
  training_size: 0.2
  batch_size: 256
  early_stopping: 32
