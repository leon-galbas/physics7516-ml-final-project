simulation:
  repo_name: "10000p_default_ranges"
  n_samples: 200000
  n_timepoints: 10000
  seed: 42

data:
  transforms:
    - TimeSlice:
        t_min: 0
        t_max: 10
    - Resample:
        n_timepoints: 500
        distribution: "even"
    - Gaussian:
        std: 0.1
  ts_features:
    - t
    - x
    - y
    - z
  scalar_features: []
  targets:
    - v0
    - theta
    - phi



model:
  name: "MLP"
  params:
    input_dim: 4000
    output_dim: 8
    hidden_dim: [16000, 4000]
    num_hidden_layers: 2

loss:
  name: "MSE"
  params: {}

optimizer:
  name: "Adam"
  params:
    lr: 1e-3

scheduler:
  name: "ReduceLROnPlateau"
  params:
    mode: "min"
    factor: 0.1
    patience: 3

training:
  seed: 42
  training_size: 0.2
  batch_size: 256
